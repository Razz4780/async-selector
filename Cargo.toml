[package]
name = "async-selector"
version = "0.4.3"
edition = "2024"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Razz4780/async-selector"
authors = ["Michał Smolarek <msmolarekg@gmail.com>"]
description = "Fast and flexible asynchronous task selector"
publish = true
keywords = ["async", "concurrency"]
categories = ["asynchronous", "concurrency"]
rust-version = "1.85.1"

# The benches use criterion's harness.
[lib]
bench = false

[dependencies]
futures = "0.3"
static_assertions = "1"

[dev-dependencies]
criterion = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[[bench]]
name = "insert"
harness = false

[[bench]]
name = "poll"
harness = false

[[bench]]
name = "wakeups"
harness = false

[[bench]]
name = "removal"
harness = false

[[bench]]
name = "parallel"
harness = false

[target.'cfg(loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
